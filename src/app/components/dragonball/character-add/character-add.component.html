<h3>Agregar: {{ nombre() }}</h3>
<input
  type="text"
  class="form-control border border-primary"
  placeholder="Nombre"
  [value]="nombre()"
  (change)="nombre.set(txtNombre.value)"
  (input)="nombre.set(txtNombre.value)"
  #txtNombre
/>
<h3>Poder: {{ poder() }}</h3>
<input
  type="number"
  class="form-control mt-2 border border-primary"
  placeholder="Poder"
  [value]="poder()"
  (input)="poder.set(+txtPoder.value)"
  #txtPoder
/>

<button
  (click)="addPersonaje()"
  class="btn btn-primary mt-2"
>
  Agregar
</button>
