<h1>{{ name() }}</h1>

<dl>
  <td>Nombre:</td>
  <dd>{{ name() }}</dd>

  <td>Edad:</td>
  <dd>{{ age() }}</dd>

  <td>Metodo:</td>
  <dd>{{ heroDescription() }}</dd>

  <td>Capitalizado:</td>
  <dd>{{ capitalizedName() }}</dd>
</dl>

<button (click)="changeHero()" class="btn btn-primary mx-2">Cambiar Nombre</button>
<button (click)="resetForm()" class="btn btn-danger mx-2">Reset</button>
<button (click)="chageAge()" class="btn btn-warning mx-2">Cambiar Edad</button>
